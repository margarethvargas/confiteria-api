services:

  postgres:
    image: postgres:16
    container_name: confiteria-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: confiteria
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: confiteria-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: confiteria
    depends_on:
      - postgres

volumes:
  postgres_data: